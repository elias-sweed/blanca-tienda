<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101216" />
    <title>Blanca Tienda</title>
    <script>
      // Tema antes del primer pintado: evita el parpadeo entre temas.
      // Lee la preferencia guardada ('claro' | 'oscuro' | 'sistema').
      try {
        var t = localStorage.getItem('tema') || 'sistema';
        var r = t === 'sistema'
          ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro')
          : t;
        document.documentElement.dataset.tema = r;
      } catch (e) {
        document.documentElement.dataset.tema = 'oscuro';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
